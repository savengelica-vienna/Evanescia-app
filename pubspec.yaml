name: apps
description: Evanescia Apps
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.0
  http: ^1.2.0
  path_provider: ^2.1.0
  open_filex: ^4.5.0
  package_info_plus: ^8.0.0
  image_picker: ^1.1.2
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.0

flutter_launcher_icons:
  android: true
  image_path: "assets/icon.png"

flutter:
  uses-material-design: true
  shaders:
    - shaders/lens.frag
