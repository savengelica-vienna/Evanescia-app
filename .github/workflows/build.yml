name: Build APK

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate android project
        run: flutter create --platforms=android --org com.nnev --project-name nnevapp .

      - name: Pasang keystore tetap (supaya update APK tidak bentrok)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Secret KEYSTORE_BASE64 belum diisi" >&2
            exit 1
          fi
          mkdir -p ~/.android
          echo "$KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore

      - name: Patch manifest
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"/>\n    <application|' $M
          sed -i 's|android:label="[^"]*"|android:label="NnevApp"|' $M

      - run: flutter pub get

      - name: Matikan Android lint vital (workaround crash lint)
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/nolint.gradle <<'EOF'
          allprojects {
            tasks.configureEach { t ->
              if (t.name.startsWith('lintVital')) { t.enabled = false }
            }
          }
          EOF

      - name: Matikan lint di build.gradle app
        run: |
          F=android/app/build.gradle.kts
          if [ -f "$F" ]; then
            sed -i '0,/^android {/s//android {\n    lint {\n        checkReleaseBuilds = false\n        abortOnError = false\n    }/' "$F"
          else
            F=android/app/build.gradle
            sed -i '0,/^android {/s//android {\n    lintOptions {\n        checkReleaseBuilds false\n        abortOnError false\n    }/' "$F"
          fi
          echo "== $F =="
          grep -n -B1 -A6 "^android {" "$F"

      - name: Build release APK
        run: |
          VER=${GITHUB_REF_NAME#v}
          flutter build apk --release --build-name=$VER --build-number=${{ github.run_number }}
          cp build/app/outputs/flutter-apk/app-release.apk app-release.apk

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: app-release.apk
          generate_release_notes: true

      - name: Update version in Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          VER=${GITHUB_REF_NAME#v}
          URL="https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/app-release.apk"
          curl -sS --fail -X PATCH "$SUPABASE_URL/rest/v1/app_config?id=eq.android" \
            -H "apikey: $SUPABASE_SECRET_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"version_code\": ${{ github.run_number }}, \"version_name\": \"$VER\", \"apk_url\": \"$URL\", \"changelog\": \"Versi $VER\"}"
